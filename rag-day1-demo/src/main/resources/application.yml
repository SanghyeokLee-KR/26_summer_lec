spring:
  application:
    name: rag-day1-demo
  servlet:
    multipart:
      max-file-size: 20MB   # 기본값 1MB — Lab1.4 PDF 업로드에서 413 나는 걸 막기 위해 올림
      max-request-size: 20MB
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3   # 실측 결과 nomic-embed-text는 한국어 의미 구분에 실패함 (아래 커리큘럼 문서 참고) — 반드시 bge-m3 사용
      chat:
        options:
          model: llama3.2:3b

# Lab1.3 실습 문서 경로 (Lab1.2는 agentic-rag-survey.pdf를 코드에 직접 고정해서 씀)
rag:
  demo:
    document-path: classpath:/docs/manual.pdf

# QuestionAnswerAdvisor가 LLM에 최종적으로 넘기는 프롬프트(system+user 메시지 전체)를 콘솔에 출력
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
